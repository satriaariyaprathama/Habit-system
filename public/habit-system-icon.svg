<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Moss-green gradient for depth, top → bottom -->
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4B7A4A"/>
      <stop offset="55%" stop-color="#3B6339"/>
      <stop offset="100%" stop-color="#2E4E2C"/>
    </linearGradient>
    <!-- Faint top-left highlight on the paper surface -->
    <radialGradient id="glow" cx="0.35" cy="0.25" r="0.75">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Soft shadow for the ring + checkmark -->
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1F2A22" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Paper-cream rounded-square background -->
  <rect width="512" height="512" rx="112" fill="#F3F1EA"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- Subtle inner border -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#D8D3C4" stroke-width="1.5"/>

  <!-- Progress ring: ~85% arc, gap centred at top, rounded caps -->
  <path d="M 357 117 A 172 172 0 1 1 155 117"
        fill="none" stroke="url(#ring)" stroke-width="38"
        stroke-linecap="round" filter="url(#sh)"/>

  <!-- Amber accent dot at the ring gap — the "streak / reward" marker -->
  <circle cx="256" cy="72" r="20" fill="#B8823B" filter="url(#sh)"/>
  <circle cx="256" cy="72" r="20" fill="none" stroke="#F3F1EA" stroke-width="4"/>

  <!-- Clean, bold checkmark inside the ring -->
  <path d="M 188 256 L 232 302 L 330 198"
        fill="none" stroke="#4B7A4A" stroke-width="32"
        stroke-linecap="round" stroke-linejoin="round"
        filter="url(#sh)"/>
</svg>
