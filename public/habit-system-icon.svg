<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Dark-green gradient for the tallest (most recent) bar -->
    <linearGradient id="barTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4B7A4A"/>
      <stop offset="100%" stop-color="#2E4E2C"/>
    </linearGradient>
    <!-- Faint top-left highlight on the paper surface -->
    <radialGradient id="glow" cx="0.35" cy="0.25" r="0.75">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Soft shadow shared by all bars -->
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1F2A22" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Paper-cream rounded-square background -->
  <rect width="512" height="512" rx="112" fill="#F3F1EA"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- Subtle inner border -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#D8D3C4" stroke-width="1.5"/>

  <!-- Baseline -->
  <line x1="80" y1="392" x2="432" y2="392" stroke="#D8D3C4" stroke-width="2" stroke-linecap="round"/>

  <!-- Three ascending bars — lighter to darker = momentum building -->
  <rect x="108" y="292" width="72" height="100" rx="14" fill="#8FAF87" filter="url(#sh)"/>
  <rect x="220" y="217" width="72" height="175" rx="14" fill="#4B7A4A" filter="url(#sh)"/>
  <rect x="332" y="142" width="72" height="250" rx="14" fill="url(#barTop)" filter="url(#sh)"/>

  <!-- Amber cap on the tallest bar — the "streak / goal" marker -->
  <rect x="332" y="118" width="72" height="28" rx="14" fill="#B8823B" filter="url(#sh)"/>
</svg>
